# TLS terminator in front of the demo.
#
# The C2PA plugin validates segments with the Web Crypto API, which browsers
# only expose in a secure context. Serving the player over HTTPS is therefore
# a requirement for every origin other than localhost/127.0.0.1.
#
# Player *and* stream are published under the same HTTPS origin here, on
# purpose:
#   * an HTTPS page may not load http:// subresources (mixed content), so the
#     MPD and the CMAF segments have to be HTTPS as well
#   * same origin means no CORS preflights and no Access-Control headers to
#     get right for the Range requests dash.js makes
#   * one certificate covers everything
#
# So: /                -> c2pa-player  (static site, the dash.js player)
#     /channel1/       -> live-origin  (MPD, segments, /state)
#     /ebuplayer/      -> ebu-player   (the EBU / Security4Media player,
#     /assets/         -> ebu-player    prefix stripped; its bundle hard-codes
#                                       absolute /assets/ URLs, see below)

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # DASH manifests are small and highly compressible, segments are not.
    # application/wasm is for the EBU player, which loads two 8 MB c2pa
    # engines per page view - they shrink to about a third.
    gzip on;
    gzip_types application/dash+xml application/vnd.apple.mpegurl
               application/javascript text/css text/xml application/wasm;

    # HTTPS only, no plain HTTP listener: the published port (8443 by
    # default) differs from the port nginx listens on, so a redirect here
    # could not reconstruct the right URL - and an http:// fallback is
    # exactly what has to be avoided, it is the insecure origin where
    # crypto.subtle is missing.
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server-chain.pem;
        ssl_certificate_key /etc/nginx/certs/server-key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:2m;
        ssl_session_timeout 1h;

        # no HSTS on purpose: it would pin this host to HTTPS in the browser
        # long after the demo is gone

        # live stream from Unified Origin: MPD, CMAF segments and /state
        location /channel1/ {
            proxy_pass http://live-origin:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # hand segments to the player as they arrive - buffering them
            # here would add a segment duration to the end-to-end latency
            proxy_buffering off;
            proxy_request_buffering off;

            # the origin packages per request, a stale manifest would stall
            # playback on the live edge
            proxy_cache off;
            add_header Cache-Control "no-store" always;
        }

        # EBU / Security4Media Content Credentials player, the second player
        # on the same stream (prebuilt image, see docker-compose.yaml):
        #   https://<host>:8443/ebuplayer/?video=https://<host>:8443/channel1/channel1.isml/.mpd&label=on
        #
        # The image is built with Vite's base '/', so its page and bundle
        # hard-code absolute /assets/... URLs (JS chunks, the c2pa wasm
        # engines, the trust lists). The page is published under /ebuplayer/
        # with the prefix stripped, and /assets/ is handed to the same
        # container - the dash.js player has no /assets/ path, so nothing
        # collides.
        location /ebuplayer/ {
            proxy_pass http://ebu-player:8080/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # revalidate the page as well, see /assets/ below
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-cache" always;
        }

        # /ebuplayer without the slash would fall through to the dash.js
        # player. A relative redirect, because nginx cannot know the
        # published port (see above) - the browser can.
        location = /ebuplayer {
            absolute_redirect off;
            return 301 /ebuplayer/$is_args$args;
        }

        location /assets/ {
            proxy_pass http://ebu-player:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # the image marks its assets immutable for a week, but their
            # names carry no content hash (assets/index.js) - a browser would
            # keep the old bundle for seven days after an image update.
            # Revalidate instead, as c2pa-live-dashjs/nginx.conf does.
            proxy_hide_header Cache-Control;
            proxy_hide_header Expires;
            add_header Cache-Control "no-cache" always;
        }

        # the dash.js player itself
        location / {
            proxy_pass http://c2pa-player:80;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
