services:
  live-origin:
    build: origin
    ports:
      - 80:80
    environment:
      - UspLicenseKey
      - PUB_POINT_NAME=channel1
      - LOG_LEVEL=warn
      - PUB_POINT_OPTS=--archiving=1 --archive_length=3600 --archive_segment_length=1800 --dvr_window_length=30 --restart_on_encoder_reconnect --mpd.min_buffer_time=48/25 --mpd.suggested_presentation_delay=48/25 --hls.minimum_fragment_length=48/25 --mpd.minimum_fragment_length=48/25 --mpd.segment_template=number_timeline --hls.client_manifest_version=4 --hls.fmp4
      # Trusted Media (C2PA): AIX document used to sign the live stream,
      # generate it with ./generate-certs-and-aix.sh (see README)
      - AIX_FILE=/opt/aix/minimal.aix
    volumes:
      - ./minimal.aix:/opt/aix/minimal.aix:ro
    healthcheck:
      test: curl http://localhost/$$PUB_POINT_NAME/$$PUB_POINT_NAME.isml/state
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      - default
  # nginx with the RTMP module: terminates the RTMP ingest and starts an
  # FFmpeg transcoder per published stream (exec_push), which pushes CMAF to
  # the origin. nginx keeps running when no encoder is connected, so the
  # container survives an encoder that comes and goes.
  rtmp-ingest:
    build:
      context: .
      dockerfile: upd/Dockerfile
    ports:
      - 1935:1935  # RTMP ingest, publish to rtmp://localhost:1935/live/stream
      - 8080:8080  # statistics UI, http://localhost:8080/stat
    restart: unless-stopped
    environment:
      - PUB_POINT_URI=http://live-origin/channel1/channel1.isml
      - 'TRACKS={ "video": [ { "width": 1280, "height": 720, "bitrate": "4000k", "codec": "libx264", "framerate": 25, "gop": 48, "timescale": 25 },{ "width": 640, "height": 360, "bitrate": "2400k", "codec": "libx264", "framerate": 25, "gop": 48, "timescale": 25 } ], "audio": [ { "samplerate": 48000, "bitrate": "64k", "codec": "aac", "language": "eng", "timescale": 48000, "frag_duration_micros": 1920000 },{ "samplerate": 48000, "bitrate": "64k", "codec": "aac", "language": "dut", "timescale": 48000, "frag_duration_micros": 1920000 } ] }'
    depends_on:
      live-origin:
        condition: service_healthy
    healthcheck:
      test: curl -fsS http://localhost:8080/healthz
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
  # Static website that plays the C2PA signed DASH stream, the URL to play can
  # be passed as a query parameter:
  # http://localhost:8090/?url=http://localhost/channel1/channel1.isml/.mpd
  #
  # Note that this port only works on localhost: the C2PA plugin validates
  # segments with the Web Crypto API, which browsers withhold on insecure
  # origins. To open the demo on a LAN address use the tls-proxy below.
  c2pa-player:
    build: c2pa-live-dashjs
    ports:
      - 8090:80
    restart: unless-stopped
    networks:
      - default
  # HTTPS entry point, needed to open the player anywhere but on localhost:
  # crypto.subtle is only exposed in a secure context, and without it every
  # segment fails validation with "Internal validation error
  # (ManifestBoxValidator)".
  #
  # Publishes player and stream under one origin, so the HTTPS page does not
  # load the MPD as mixed content and no CORS is involved:
  #   https://<host>:8443/            -> c2pa-player
  #   https://<host>:8443/channel1/   -> live-origin
  #
  # Opt in, because it needs the locally generated certificate:
  #   ./tls/generate-tls-cert.sh      (once, works offline)
  #   docker compose --profile tls up -d
  tls-proxy:
    image: nginx:1.27-alpine
    #profiles:
    #  - tls
    ports:
      - ${TLS_PORT:-8443}:443
    restart: unless-stopped
    volumes:
      - ./tls/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tls:/etc/nginx/certs:ro
    depends_on:
      live-origin:
        condition: service_healthy
    healthcheck:
      test: wget -q --no-check-certificate -O /dev/null https://localhost/
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
  # Same stream, one port up, but with damaged segments: an HTTPS reverse
  # proxy that flips bits in CMAF media segments on their way to the player
  # (every 5th segment of every track by default).
  #
  # This is what makes the C2PA validation visible - a single flipped bit in
  # the mdat payload breaks the hash over the segment, so the player marks it
  # as tampered while the picture keeps running. Init segments and manifests
  # are never touched.
  #
  # Publishes the same layout as tls-proxy, so both URLs play the same stream:
  #   https://<host>:8443/  clean       https://<host>:8444/  glitched
  #   https://<host>:8444/glitch/       control panel (change it while it runs)
  #
  # Runs with the tls profile, it needs the same certificate:
  #   ./tls/generate-tls-cert.sh
  #   docker compose --profile tls up -d
  glitch-proxy:
    build: glitch-proxy
    #profiles:
    #  - tls
    #  - glitch
    ports:
      - ${GLITCH_PORT:-8444}:443
    restart: unless-stopped
    environment:
      - UPSTREAM_STREAM=http://live-origin:80
      - UPSTREAM_PLAYER=http://c2pa-player:80
      - STREAM_PREFIXES=/channel1/
      # start corrupting right away, all of this is changeable at runtime
      - GLITCH_ENABLED=${GLITCH_ENABLED:-true}
      # every Nth media segment per representation, 0 disables
      - GLITCH_EVERY=${GLITCH_EVERY:-5}
      # 1 bit breaks the C2PA hash, ~2000 bits break the picture as well
      - GLITCH_BITS=${GLITCH_BITS:-1}
      # c2pa (inband COSE signature) | mdat (media payload) | moof | any
      - GLITCH_TARGET=${GLITCH_TARGET:-c2pa}
      # regex on the segment name, empty hits every track (e.g. video)
      - GLITCH_TRACKS=${GLITCH_TRACKS:-}
      # basic auth on /glitch/ only - the stream, the player and /healthz stay
      # open. Empty password disables it.
      - GLITCH_USER=${GLITCH_USER:-glitch}
      - GLITCH_PASSWORD=${GLITCH_PASSWORD:-glitch}
    volumes:
      - ./tls:/etc/glitch/certs:ro
    depends_on:
      live-origin:
        condition: service_healthy
      c2pa-player:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import ssl, urllib.request; urllib.request.urlopen('https://localhost/glitch/healthz', context=ssl._create_unverified_context())
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - default
