user www-data;

# One worker keeps all RTMP state in a single process: nginx-rtmp collects
# statistics per worker (so /stat would only ever show a part of the picture)
# and exec_push would otherwise have to be coordinated with rtmp_auto_push.
worker_processes 1;

pid /run/nginx.pid;
error_log /var/log/nginx/error.log info;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    multi_accept on;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Encoders publish to rtmp://<host>:1935/live/<stream>
        application live {
            live on;
            record off;

            # only hand out the stream once video and a keyframe are there,
            # so the transcoder below starts on a clean GOP boundary
            wait_video on;
            wait_key on;

            # Transcode whatever is published into CMAF and ingest it into
            # Unified Origin. nginx starts this per published stream and
            # kills it again on disconnect, so the container itself stays up
            # while there is no ingest.
            #
            # nginx points the child's stdio at /dev/null, so the transcoder
            # is redirected into a log file explicitly - docker-entrypoint.sh
            # tails that file into the container log.
            exec_push /usr/local/bin/ingest.sh $app $name
                1>>/var/log/nginx/transcoder.log
                2>>/var/log/nginx/transcoder.log;

            # TERM (not the default KILL) so FFmpeg can shut down its HTTP
            # POST bodies to the origin cleanly; ingest.sh execs FFmpeg so
            # the signal reaches it directly
            exec_kill_signal term;

            # restart the transcoder if it dies while the encoder is still up
            respawn on;
            respawn_timeout 5s;
        }
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /var/www/html;

        location = / {
            return 302 /stat;
        }

        # RTMP statistics as XML; stat.xsl turns it into the dashboard
        location = /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
            add_header Cache-Control "no-store" always;
        }

        location = /stat.xsl {
            types { }
            default_type text/xsl;
            add_header Cache-Control "no-store" always;
        }

        # written by docker-entrypoint.sh, tells the dashboard where the
        # transcoder ingests into
        location = /ingest.json {
            add_header Cache-Control "no-store" always;
        }

        # /origin/state, generated at startup from PUB_POINT_URI so the
        # dashboard can show the state of the publishing point
        include /etc/nginx/dynamic/*.conf;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }
    }
}
