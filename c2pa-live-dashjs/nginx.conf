# Static hosting for the player.
#
# The only reason this file exists is caching. The assets have no content hash
# in their names (`app.bundle.js`, not `app.<hash>.js`), and nginx by default
# sends neither `Cache-Control` nor `Expires` for static files - only
# `Last-Modified` and an `ETag`. Browsers then fall back to heuristic
# freshness and may serve the bundle from cache without asking, so a rebuilt
# player keeps showing the old UI until someone does a hard reload. That is a
# nasty way to lose half an hour after `docker compose up -d --build
# c2pa-player`.
#
# `no-cache` does not disable caching, it only forces a revalidation: the
# browser still stores the file and nginx answers with a 304 when nothing
# changed, so the cost is one conditional request per asset.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
